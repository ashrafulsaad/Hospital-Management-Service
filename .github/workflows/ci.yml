name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cp .env.example .env
          KEY=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          sed -i "s|^FIELD_ENCRYPTION_KEY=.*|FIELD_ENCRYPTION_KEY=$KEY|" .env

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for database
        run: sleep 10

      - name: Check migrations are committed
        run: docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: docker compose exec -T web pytest -v

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanners
        run: pip install bandit pip-audit ruff
      - name: Ruff (lint)
        run: ruff check .
      - name: Bandit (risky code patterns, medium severity and up)
        run: bandit -r accounts config api -ll
      - name: pip-audit (vulnerable packages)
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
